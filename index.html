<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1026">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NoScam">
<title>NoScam</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="bg" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <div id="particles"></div>
  </div>
  <div id="flash" aria-hidden="true"></div>

  <header id="topbar">
    <button id="backBtn" class="iconbtn hidden" aria-label="Back">‹</button>
    <div class="brand" id="brandHome">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs>
        <path d="M32 4 L54 12 V30 C54 45 44 55 32 60 C20 55 10 45 10 30 V12 Z" fill="url(#lg)"/>
        <circle cx="32" cy="31" r="12" fill="none" stroke="#fff" stroke-width="4.5"/>
        <line x1="25" y1="38" x2="39" y2="24" stroke="#fff" stroke-width="4.5"/>
      </svg>
      <span>No<b>Scam</b></span>
    </div>
    <button id="soundBtn" class="iconbtn" aria-label="Toggle sound">🔊</button>
  </header>

  <main id="view"></main>

  <nav id="tabbar">
    <button data-tab="home" class="tab active"><span class="ti">🛡️</span><span>Check</span></button>
    <button data-tab="library" class="tab"><span class="ti">📚</span><span>Scam Library</span></button>
    <button data-tab="help" class="tab"><span class="ti">🆘</span><span>I Got Scammed</span></button>
    <button data-tab="me" class="tab"><span class="ti">⚙️</span><span>Me</span></button>
  </nav>

  <div id="rotate">
    <div class="rot-card">
      <div class="rot-phone">📱</div>
      <h2>Whoa, I get dizzy sideways</h2>
      <p>NoScam works best upright. Turn your phone back to portrait.</p>
    </div>
  </div>

  <div id="toast"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
